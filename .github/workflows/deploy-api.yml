# Sends the backend to your Hugging Face Space whenever backend code changes on main.
# Setup (once): see deploy/README.md. Until the HF_SPACE variable is set, this job skips itself.
name: Deploy API to Hugging Face

on:
  push:
    branches: [main]
    paths: ["backend/**", "deploy/huggingface/**", ".github/workflows/deploy-api.yml"]
  workflow_dispatch: # adds a "Run workflow" button on GitHub for manual deploys

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the Space's files
        run: |
          mkdir space
          cp -r backend/. space/
          cp deploy/huggingface/README.md space/README.md   # the Space's settings live in this README
          rm -rf space/tests space/.venv space/.cache space/uploads

      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }} # e.g. your-username/viralyst-api
        run: |
          cd space
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from GitHub"
          git push --force -q "https://${HF_SPACE%%/*}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
