<text x="20" y="446" fill="#e6edf3">&#160;&#160;comment&#160;&#160;&#160;1.3x&#160;&#160;#############</text>
<text x="20" y="464" fill="#e6edf3">&#160;&#160;like&#160;&#160;&#160;&#160;&#160;&#160;1.2x&#160;&#160;############</text>
<text x="20" y="482" fill="#e6edf3">&#160;&#160;follow&#160;&#160;&#160;&#160;0.8x&#160;&#160;########</text>
<text x="20" y="500" fill="#e6edf3">Weakest&#160;signal:&#160;follow.&#160;Tip:&#160;Viewers&#160;don&#x27;t&#160;follow.&#160;Make&#160;it&#160;obvious&#160;what&#160;else&#160;they&#x27;ll&#160;get&#160;from&#160;your&#160;account.</text>
<text x="20" y="518" fill="#e6edf3"></text>
<text x="20" y="536" fill="#e6edf3">A&#160;few&#160;of&#160;your&#160;followers:</text>
