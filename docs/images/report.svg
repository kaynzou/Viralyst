<text x="20" y="68" fill="#8b949e">$&#160;uv&#160;run&#160;run.py&#160;examples/good_demo.json&#160;--seed&#160;7</text>
<text x="20" y="86" fill="#58a6ff">VIRALYST&#160;&#160;&quot;I&#160;cleared&#160;4,212&#160;unread&#160;emails&#160;in&#160;30&#160;seconds&quot;</text>
<text x="20" y="104" fill="#e6edf3">Simulated&#160;450&#160;viewers&#160;across&#160;4&#160;wave(s).&#160;Seed&#160;7&#160;(use&#160;--seed&#160;7&#160;to&#160;repeat&#160;this&#160;run).</text>
<text x="20" y="122" fill="#e6edf3"></text>
<text x="20" y="140" fill="#8b949e">Wave&#160;Shown&#160;to&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;Viewers&#160;&#160;Target&#160;&#160;Watch&#160;&#160;Like&#160;&#160;Cmnt&#160;&#160;Share&#160;&#160;Save&#160;&#160;Follow&#160;&#160;Score&#160;&#160;Decision</text>
<text x="20" y="158" fill="#3fb950">1&#160;&#160;&#160;&#160;your&#160;followers&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;30&#160;&#160;&#160;&#160;&#160;93%&#160;&#160;&#160;&#160;47%&#160;&#160;&#160;13%&#160;&#160;&#160;&#160;7%&#160;&#160;&#160;&#160;&#160;0%&#160;&#160;&#160;&#160;7%&#160;&#160;&#160;&#160;&#160;&#160;0%&#160;&#160;&#160;1.18&#160;&#160;push&#160;(needs&#160;1.00)</text>
<text x="20" y="176" fill="#3fb950">2&#160;&#160;&#160;&#160;similar&#160;non-followers&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;60&#160;&#160;&#160;&#160;&#160;53%&#160;&#160;&#160;&#160;46%&#160;&#160;&#160;15%&#160;&#160;&#160;&#160;7%&#160;&#160;&#160;&#160;&#160;3%&#160;&#160;&#160;&#160;7%&#160;&#160;&#160;&#160;&#160;&#160;2%&#160;&#160;&#160;1.91&#160;&#160;push&#160;(needs&#160;1.00)</text>
<text x="20" y="194" fill="#3fb950">3&#160;&#160;&#160;&#160;Explore&#160;and&#160;Reels&#160;tab&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;120&#160;&#160;&#160;&#160;&#160;36%&#160;&#160;&#160;&#160;46%&#160;&#160;&#160;15%&#160;&#160;&#160;&#160;3%&#160;&#160;&#160;&#160;&#160;4%&#160;&#160;&#160;&#160;2%&#160;&#160;&#160;&#160;&#160;&#160;2%&#160;&#160;&#160;1.68&#160;&#160;push&#160;(needs&#160;1.00)</text>
<text x="20" y="212" fill="#f85149">4&#160;&#160;&#160;&#160;broad&#160;Reels&#160;audience&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;240&#160;&#160;&#160;&#160;&#160;15%&#160;&#160;&#160;&#160;36%&#160;&#160;&#160;&#160;9%&#160;&#160;&#160;&#160;3%&#160;&#160;&#160;&#160;&#160;1%&#160;&#160;&#160;&#160;2%&#160;&#160;&#160;&#160;&#160;&#160;0%&#160;&#160;&#160;0.85&#160;&#160;stop&#160;(needs&#160;1.00)</text>
<text x="20" y="230" fill="#e6edf3"></text>
<text x="20" y="248" fill="#3fb950">Verdict:&#160;&#160;&#160;&#160;&#160;&#160;STRONG:&#160;reached&#160;a&#160;broad&#160;audience&#160;before&#160;slowing&#160;down</text>
<text x="20" y="266" fill="#e6edf3">Rough&#160;reach:&#160;&#160;~555,500&#160;people&#160;(an&#160;uncalibrated&#160;guess&#160;for&#160;now)</text>
<text x="20" y="284" fill="#e6edf3"></text>
<text x="20" y="302" fill="#e6edf3">First&#160;impression:&#160;40%&#160;of&#160;viewers&#160;scrolled&#160;past&#160;within&#160;a&#160;second&#160;or&#160;two.</text>
<text x="20" y="320" fill="#e6edf3">&#160;&#160;Target&#160;audience&#160;&#160;138&#160;viewers&#160;&#160;&#160;watched&#160;56%&#160;&#160;&#160;liked&#160;19%&#160;&#160;&#160;shared&#160;5.8%</text>
<text x="20" y="338" fill="#e6edf3">&#160;&#160;Everyone&#160;else&#160;&#160;&#160;&#160;312&#160;viewers&#160;&#160;&#160;watched&#160;34%&#160;&#160;&#160;liked&#160;8%&#160;&#160;&#160;shared&#160;0.6%</text>
<text x="20" y="356" fill="#e6edf3"></text>
<text x="20" y="374" fill="#e6edf3">Signals&#160;compared&#160;with&#160;a&#160;typical&#160;reel&#160;(1.0x&#160;=&#160;typical):</text>
