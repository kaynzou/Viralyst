<text x="20" y="410" fill="#e6edf3">&#160;&#160;share&#160;&#160;&#160;&#160;&#160;1.8x&#160;&#160;##################</text>
<text x="20" y="428" fill="#e6edf3">&#160;&#160;save&#160;&#160;&#160;&#160;&#160;&#160;1.0x&#160;&#160;##########</text>
<text x="20" y="446" fill="#e6edf3">&#160;&#160;comment&#160;&#160;&#160;1.2x&#160;&#160;############</text>
<text x="20" y="464" fill="#e6edf3">&#160;&#160;like&#160;&#160;&#160;&#160;&#160;&#160;1.4x&#160;&#160;##############</text>
<text x="20" y="482" fill="#e6edf3">&#160;&#160;follow&#160;&#160;&#160;&#160;1.1x&#160;&#160;###########</text>
<text x="20" y="500" fill="#e6edf3">Weakest&#160;signal:&#160;save.&#160;Tip:&#160;No&#160;reason&#160;to&#160;save&#160;it.&#160;Add&#160;a&#160;concrete&#160;tip,&#160;steps,&#160;or&#160;a&#160;number&#160;people&#160;will&#160;want&#160;to&#160;come&#160;back&#160;to.</text>
<text x="20" y="518" fill="#e6edf3"></text>
<text x="20" y="536" fill="#e6edf3">A&#160;few&#160;of&#160;your&#160;followers:</text>
