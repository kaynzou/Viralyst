<text x="20" y="572" fill="#e6edf3">&#160;&#160;ben_21&#160;&#160;&#160;&#160;&#160;&#160;47,&#160;accountant&#160;(Toronto)&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;watched&#160;77%,&#160;liked</text>
