[project]
name = "viralyst"
version = "0.1.0"
description = "Predict how a product demo video will spread on Instagram by simulating an audience of AI personas."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "faster-whisper>=1.2.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "soundfile>=0.14.0",
    "supertonic>=1.3.1",
]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
